[tool.poetry]
name = "agentic-prog"
version = "0.1.0"
description = "Agentic Research & Model Recommender using LangGraph + Ollama"
authors = ["samue"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
langgraph = ">=0.2"
langchain = ">=0.3"
langchain-core = ">=0.3"
langchain-community = ">=0.3"
langchain-ollama = ">=0.2"
langchain-chroma = ">=0.2"
chromadb = ">=0.5"
duckduckgo-search = ">=6"
requests = ">=2.31"
beautifulsoup4 = ">=4.12"
html2text = ">=2024.2"
python-dotenv = ">=1.0"
pydantic = ">=2.0"

[tool.poetry.scripts]
researcher = "researcher:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
